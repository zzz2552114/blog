[project]
name = "blog-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhm", email = "zzz2552114@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.161.1",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
blog-backend = "blog_backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
